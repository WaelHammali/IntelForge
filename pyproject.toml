[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "intelforge"
version = "3.0.0"
description = "Autonomous penetration-testing & AI reconnaissance framework orchestrated with LangGraph"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Keystone Groupe", email = "contact@keystone.tn" }]
keywords = ["pentest", "osint", "reconnaissance", "langgraph", "security", "nmap"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "langgraph>=1.2,<2",
    "langchain>=1,<2",
    "langchain-groq>=1,<2",
    "langchain-openai>=1,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "click>=8.1",
    "requests>=2.31",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pre-commit>=3.7",
    "types-requests",
    "types-PyYAML",
]

[project.scripts]
intelforge = "intelforge.cli:main"

[project.urls]
Repository = "https://github.com/WaelHammali/Pentest_Command_DAGDIG"

[tool.hatch.build.targets.wheel]
packages = ["src/intelforge"]

[tool.hatch.build.targets.wheel.force-include]
"src/intelforge/prompts" = "intelforge/prompts"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.ruff.lint.isort]
known-first-party = ["intelforge"]

[tool.mypy]
python_version = "3.11"
packages = ["intelforge"]
mypy_path = "src"
strict = false
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = false
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["langgraph.*", "langchain.*", "langchain_core.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/intelforge"]
branch = true
