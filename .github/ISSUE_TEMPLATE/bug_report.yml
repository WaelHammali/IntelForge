name: Bug report
description: Something in IntelForge misbehaves
labels: [bug]
body:
  - type: input
    id: version
    attributes: { label: Version / commit }
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the command you ran and the output.
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
